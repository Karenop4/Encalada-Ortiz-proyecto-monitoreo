services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - red_cuenca

  productor:
    build: ./sensores      
    container_name: productor_sensores
    volumes:
      - ./sensores:/app     
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - red_cuenca

  procesador:
    build: ./consumidores   
    container_name: procesador_alertas
    volumes:
      - ./consumidores:/app
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - red_cuenca
  websocket:
    build: ./websocket_server
    container_name: websocket_server
    ports:
      - "9000:9000"
    networks:
      - red_cuenca
networks:
  red_cuenca:
    driver: bridge
